<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Join the Crew · ForgeBody</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:ital,wght@0,400;0,500;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { background: #000; color: #fff; font-family: 'Barlow', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; min-height: 100vh; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 30%, rgba(204,255,0,0.08), transparent 60%); z-index: -1; }
  .card { width: 100%; max-width: 400px; text-align: center; }
  .brand { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase; color: #CCFF00; margin-bottom: 60px; }
  .invite-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 14px; }
  .headline { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 56px; line-height: 0.88; letter-spacing: -0.035em; text-transform: uppercase; margin-bottom: 18px; }
  .headline .accent { color: #CCFF00; }
  .kicker { font-family: 'Barlow', sans-serif; font-style: italic; font-size: 16px; color: rgba(255,255,255,0.65); line-height: 1.5; max-width: 340px; margin: 0 auto 36px; }
  .code-pill { display: inline-flex; align-items: center; gap: 10px; background: rgba(204,255,0,0.08); border: 1px solid rgba(204,255,0,0.25); border-radius: 100px; padding: 12px 22px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 0.18em; color: #CCFF00; margin-bottom: 42px; }
  .code-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #CCFF00; box-shadow: 0 0 8px #CCFF00; }
  .cta { display: block; width: 100%; padding: 18px 28px; background: #CCFF00; color: #000; border: none; border-radius: 100px; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; cursor: pointer; box-shadow: 0 12px 36px rgba(204,255,0,0.3); margin-bottom: 14px; }
  .secondary { display: block; padding: 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.5); text-decoration: none; }
  .footer { position: fixed; bottom: 28px; left: 0; right: 0; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Forge / Body</div>
    <div class="invite-label">You've been invited</div>
    <div class="headline">Join the <span class="accent">crew</span>.</div>
    <div class="kicker">Up to 5 people who won't let you flake. Train together. Carry each other.</div>
    <div class="code-pill"><span class="dot"></span><span id="codeDisplay">FORGE-XXXXXX</span></div>
    <a id="ctaButton" class="cta" href="#">Open in App</a>
    <a id="storeButton" class="secondary" href="https://apps.apple.com/app/id0000000000">Don't have the app? Get it →</a>
  </div>
  <div class="footer">Forge / Body</div>
<script>
  const path = window.location.pathname;
  const match = path.match(/\/join\/([A-Z0-9\-]+)/i);
  const code = match ? match[1].toUpperCase() : '';
  if (code) document.getElementById('codeDisplay').textContent = code;
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const cta = document.getElementById('ctaButton');
  const store = document.getElementById('storeButton');
  if (isIOS) {
    cta.textContent = 'Open in ForgeBody';
    cta.addEventListener('click', (e) => {
      const startTime = Date.now();
      window.location.href = 'forgebody://join/' + code;
      setTimeout(() => {
        if (Date.now() - startTime < 2000 && !document.hidden) window.location.href = store.href;
      }, 1500);
      e.preventDefault();
    });
    store.textContent = "Don't have it? Get ForgeBody →";
  } else if (isAndroid) {
    cta.textContent = 'Get ForgeBody';
    cta.href = 'https://apps.apple.com/app/id0000000000';
    store.style.display = 'none';
  } else {
    cta.textContent = 'Open on Your iPhone';
    cta.href = 'https://apps.apple.com/app/id0000000000';
    store.textContent = 'Code: ' + code;
    store.style.pointerEvents = 'none';
  }
</script>
</body>
</html>
