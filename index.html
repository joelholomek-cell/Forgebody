<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ForgeBody" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO -->
    <title>ForgeBody — AI Fitness Platform</title>
    <meta name="description" content="AI-powered workouts, personalised meal plans and a 24/7 personal coach. Start your 7-day free trial." />
    <meta name="keywords" content="fitness app, AI workout, meal plan, personal coach, training" />

    <!-- Open Graph (for sharing) -->
    <meta property="og:title" content="ForgeBody — AI Fitness Platform" />
    <meta property="og:description" content="AI workouts, meal plans and a 24/7 coach. 7-day free trial." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #0a0a0a; color: #fff; min-height: 100vh; }
      #root { min-height: 100vh; }
      /* Safe area for iPhone notch */
      body { padding-top: env(safe-area-inset-top); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>

  </body>
</html>
